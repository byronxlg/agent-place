name: Destroy

# One-shot teardown of all app infrastructure (Lambda, API Gateway, ACM,
# Cloudflare DNS, DynamoDB, logs, Lambda role). The Terraform state bucket
# and the agent-place-ci user are excluded: they are the bootstrap surface
# and are removed out-of-band after this run (see infra/CLAUDE.md).
on:
  workflow_dispatch:

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init
        working-directory: infra
      - run: >
          terraform destroy -no-color -auto-approve
          -target=cloudflare_dns_record.api
          -target=aws_apigatewayv2_domain_name.api
          -target=aws_apigatewayv2_api.api
          -target=aws_acm_certificate.api
          -target=cloudflare_dns_record.acm_validation
          -target=aws_lambda_function.api
          -target=aws_iam_role.lambda
          -target=aws_cloudwatch_log_group.lambda
          -target=aws_dynamodb_table.main
        working-directory: infra
